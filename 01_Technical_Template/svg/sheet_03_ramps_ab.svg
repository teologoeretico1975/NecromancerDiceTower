<svg baseProfile="full" height="297mm" version="1.1" viewBox="0 0 210 297" width="210mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Sheet 03 - Baffle Core Bulkheads | A4 portrait 210x297 mm | target export 96 dpi</title><defs /><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="10">Sheet 03 - Baffle Core Bulkheads</text><text fill="black" font-family="Arial" font-size="5px" font-weight="bold" x="10" y="14">v004 — BAFFLE CORE (BULKHEADS)</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="20">Replace ramps with anti-jam bulkheads. Keep central die channel clear (&gt;=30 mm).</text><rect fill="#e6e6e6" height="120.0" stroke="none" width="5.0" x="10.0" y="34.0" /><rect fill="#e6e6e6" height="120.0" stroke="none" width="5.0" x="70.0" y="34.0" /><rect fill="none" height="120.0" stroke="black" stroke-width="0.5" width="65.0" x="10.0" y="34.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="15.0" x2="15.0" y1="34.0" y2="154.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="70.0" x2="70.0" y1="34.0" y2="154.0" /><rect fill="none" height="16.0" stroke="black" stroke-width="0.5" width="22.0" x="19.0" y="54.0" /><rect fill="none" height="16.0" stroke="black" stroke-width="0.5" width="22.0" x="44.0" y="108.0" /><text fill="black" font-family="Arial" font-size="4.2px" font-weight="bold" x="32.0" y="31.0">B1 — BULKHEAD</text><text fill="black" font-family="Arial" font-size="2.9px" x="10.4" y="159.0">GLUE TAB</text><text fill="black" font-family="Arial" font-size="2.9px" x="70.4" y="159.0">GLUE TAB</text><rect fill="#e6e6e6" height="120.0" stroke="none" width="5.0" x="104.0" y="34.0" /><rect fill="#e6e6e6" height="120.0" stroke="none" width="5.0" x="164.0" y="34.0" /><rect fill="none" height="120.0" stroke="black" stroke-width="0.5" width="65.0" x="104.0" y="34.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="109.0" x2="109.0" y1="34.0" y2="154.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="164.0" x2="164.0" y1="34.0" y2="154.0" /><rect fill="none" height="16.0" stroke="black" stroke-width="0.5" width="22.0" x="138.0" y="54.0" /><rect fill="none" height="16.0" stroke="black" stroke-width="0.5" width="22.0" x="113.0" y="108.0" /><text fill="black" font-family="Arial" font-size="4.2px" font-weight="bold" x="126.0" y="31.0">B2 — BULKHEAD</text><text fill="black" font-family="Arial" font-size="2.9px" x="104.4" y="159.0">GLUE TAB</text><text fill="black" font-family="Arial" font-size="2.9px" x="164.4" y="159.0">GLUE TAB</text><text fill="black" font-family="Arial" font-size="3.2px" x="10" y="165">Open windows must alternate left/right between B1 and B2.</text><text fill="black" font-family="Arial" font-size="3.2px" x="10" y="169">Install B1 above B2 with 25–30 mm vertical gap in final assembly.</text><text fill="black" font-family="Arial" font-size="3.60px" x="10" y="259">LEGEND</text><line fill="none" stroke="black" stroke-width="0.5" x1="10" x2="28.0" y1="263.0" y2="263.0" /><text fill="black" font-family="Arial" font-size="3.60px" x="31.0" y="264.0">CUT</text><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="10" x2="28.0" y1="269.0" y2="269.0" /><text fill="black" font-family="Arial" font-size="3.60px" x="31.0" y="270.0">VALLEY FOLD</text><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="10" x2="28.0" y1="275.0" y2="275.0" /><text fill="black" font-family="Arial" font-size="3.60px" x="31.0" y="276.0">MOUNTAIN FOLD</text><rect fill="#e6e6e6" height="6.0" stroke="none" width="18.0" x="10" y="279.0" /><text fill="black" font-family="Arial" font-size="3.60px" x="31.0" y="284.0">GLUE TAB</text><polygon fill="#FF6600" points="10,287.0 28.0,287.0 10,293.0" stroke="black" stroke-width="0.4" /><text fill="black" font-family="Arial" font-size="3