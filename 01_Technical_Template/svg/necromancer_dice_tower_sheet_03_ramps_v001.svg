<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>Necromancer Dice Tower - Sheet 03 Rampe Interne v001</title>
  <defs>
    <style>
      .cut { fill: none; stroke: #000000; stroke-width: 0.35; }
      .fold-valley { fill: none; stroke: #0066cc; stroke-width: 0.35; stroke-dasharray: 3 2; }
      .fold-mountain { fill: none; stroke: #cc0000; stroke-width: 0.35; stroke-dasharray: 1 2; }
      .guide { fill: none; stroke: #999999; stroke-width: 0.25; stroke-dasharray: 2 2; }
      .glue { fill: #eeeeee; stroke: #000000; stroke-width: 0.35; }
      .label { font-family: Arial, sans-serif; font-size: 4px; fill: #000000; }
      .small { font-family: Arial, sans-serif; font-size: 3px; fill: #000000; }
      .tiny { font-family: Arial, sans-serif; font-size: 2.6px; fill: #000000; }
      .title { font-family: Arial, sans-serif; font-size: 4.5px; font-weight: bold; fill: #000000; }
    </style>
  </defs>
  <rect x="10" y="10" width="190" height="277" class="guide"/>
  <text x="10" y="7" class="title">Necromancer Dice Tower - Sheet 03 Rampe Interne v001</text>

  <rect x="38" y="38" width="58" height="70" class="cut"/>
  <rect x="38" y="30" width="58" height="8" class="glue"/>
  <rect x="30" y="38" width="8" height="70" class="glue"/>
  <rect x="96" y="38" width="8" height="70" class="glue"/>
  <line x1="38" y1="38" x2="96" y2="38" class="fold-valley"/>
  <line x1="38" y1="38" x2="38" y2="108" class="fold-valley"/>
  <line x1="96" y1="38" x2="96" y2="108" class="fold-valley"/>
  <text x="57" y="74" class="label">RAMPA A</text>
  <text x="46" y="35" class="tiny">INCOLLA ALLA PARETE</text>
  <text x="32" y="73" class="tiny" transform="rotate(90 32 73)">COLLA</text>
  <text x="98" y="73" class="tiny" transform="rotate(90 98 73)">COLLA</text>

  <rect x="118" y="38" width="58" height="70" class="cut"/>
  <rect x="118" y="30" width="58" height="8" class="glue"/>
  <rect x="110" y="38" width="8" height="70" class="glue"/>
  <rect x="176" y="38" width="8" height="70" class="glue"/>
  <line x1="118" y1="38" x2="176" y2="38" class="fold-valley"/>
  <line x1="118" y1="38" x2="118" y2="108" class="fold-valley"/>
  <line x1="176" y1="38" x2="176" y2="108" class="fold-valley"/>
  <text x="137" y="74" class="label">RAMPA B</text>
  <text x="126" y="35" class="tiny">INCOLLA ALLA PARETE</text>
  <text x="112" y="73" class="tiny" transform="rotate(90 112 73)">COLLA</text>
  <text x="178" y="73" class="tiny" transform="rotate(90 178 73)">COLLA</text>

  <rect x="38" y="138" width="58" height="70" class="cut"/>
  <rect x="38" y="130" width="58" height="8" class="glue"/>
  <rect x="30" y="138" width="8" height="70" class="glue"/>
  <rect x="96" y="138" width="8" height="70" class="glue"/>
  <line x1="38" y1="138" x2="96" y2="138" class="fold-valley"/>
  <line x1="38" y1="138" x2="38" y2="208" class="fold-valley"/>
  <line x1="96" y1="138" x2="96" y2="208" class="fold-valley"/>
  <text x="57" y="174" class="label">RAMPA C</text>
  <text x="46" y="135" class="tiny">INCOLLA ALLA PARETE</text>
  <text x="32" y="173" class="tiny" transform="rotate(90 32 173)">COLLA</text>
  <text x="98" y="173" class="tiny" transform="rotate(90 98 173)">COLLA</text>

  <text x="30" y="220" class="small">Superficie rampa: 58 x 70 mm. Alette laterali: 8 mm. Aletta posteriore: 8 mm.</text>
  <text x="30" y="226" class="small">Installa le rampe in direzioni alternate per creare un percorso dadi a zig-zag.</text>

  <rect x="10" y="262" width="20" height="20" class="cut"/>
  <text x="35" y="274" class="small">Scale check: 20 x 20 mm</text>

  <text x="120" y="250" class="label">Legend</text>
  <line x1="120" y1="258" x2="145" y2="258" class="cut"/>
  <text x="150" y="259" class="small">Cut</text>
  <line x1="120" y1="265" x2="145" y2="265" class="fold-valley"/>
  <text x="150" y="266" class="small">Valley fold</text>
  <line x1="120" y1="272" x2="145" y2="272" class="fold-mountain"/>
  <text x="150" y="273" class="small">Mountain fold</text>
  <rect x="120" y="278" width="25" height="5" class="glue"/>
  <text x="150" y="282" class="small">Glue tab</text>
