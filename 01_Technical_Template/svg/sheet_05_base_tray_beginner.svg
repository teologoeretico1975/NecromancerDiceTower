<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="297mm" version="1.1" viewBox="0 0 210 297" width="210mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Sheet 05 - Base Tray | A4 portrait 210x297 mm | target export 96 dpi</title><defs /><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="10">Sheet 05 - Base Tray</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="16">Parts: I floor, J side walls, K back wall, L front lip</text><rect fill="none" height="130.0" stroke="black" stroke-width="0.5" width="100.0" x="45" y="95" /><rect fill="none" height="10.0" stroke="black" stroke-width="0.5" width="100.0" x="45" y="85.0" /><rect fill="none" height="25.0" stroke="black" stroke-width="0.5" width="100.0" x="45" y="225.0" /><rect fill="none" height="130.0" stroke="black" stroke-width="0.5" width="25.0" x="20.0" y="95" /><rect fill="none" height="130.0" stroke="black" stroke-width="0.5" width="25.0" x="145.0" y="95" /><rect fill="#e6e6e6" height="10.0" stroke="none" width="10.0" x="35.0" y="85.0" /><rect fill="none" height="10.0" stroke="black" stroke-width="0.5" width="10.0" x="35.0" y="85.0" /><rect fill="#e6e6e6" height="10.0" stroke="none" width="10.0" x="145.0" y="85.0" /><rect fill="none" height="10.0" stroke="black" stroke-width="0.5" width="10.0" x="145.0" y="85.0" /><rect fill="#e6e6e6" height="25.0" stroke="none" width="10.0" x="35.0" y="225.0" /><rect fill="none" height="25.0" stroke="black" stroke-width="0.5" width="10.0" x="35.0" y="225.0" /><rect fill="#e6e6e6" height="25.0" stroke="none" width="10.0" x="145.0" y="225.0" /><rect fill="none" height="25.0" stroke="black" stroke-width="0.5" width="10.0" x="145.0" y="225.0" /><rect fill="#e6e6e6" height="20.0" stroke="none" width="65.0" x="62.5" y="250.0" /><rect fill="none" height="20.0" stroke="black" stroke-width="0.5" width="65.0" x="62.5" y="250.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="45" x2="145.0" y1="95" y2="95" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="45" x2="145.0" y1="225.0" y2="225.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="45" x2="45" y1="95" y2="225.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="145.0" x2="145.0" y1="95" y2="225.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="45" x2="45" y1="85.0" y2="95" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="145.0" x2="145.0" y1="85.0" y2="95" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="45" x2="45" y1="225.0" y2="250.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="145.0" x2="145.0" y1="225.0" y2="250.0" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="62.5" x2="127.5" y1="250.0" y2="250.0" /><text fill="black" font-family="Arial" font-size="3.6px" x="88.0" y="93.5">F1</text><text fill="black" font-family="Arial" font-size="3.6px" x="88.0" y="223.5">F2</text><text fill="black" font-family="Arial" font-size="3.6px" x="46.2" y="105">F3</text><text fill="black" font-family="Arial" font-size="3.6px" x="146.2" y="105">F4</text><text fill="black" font-family="Arial" font-size="3.6px" x="88.0" y="248.5">F5(M)</text><text fill="black" font-family="Arial" font-size="3.6px" x="77.0" y="160.0">I - TRAY FLOOR</text><text fill="black" font-family="Arial" font-size="3.6px" x="76.0" y="92">L - FRONT LIP (LOW)</text><text fill="black" font-family="Arial" font-size="3.6px" x="75.0" y="239.0">K - BACK WALL</text><text fill="black" font-family="Arial" font-size="3.6px" transform="rotate(-90 29 167.0)" x="29" y="167.0">J - SIDE WALL</text><text fill="black" font-family="Arial" font-size="3.6px" transform="rotate(-90 159.0 167.0)" x="159.0" y="167.0">J - SIDE WALL</text><text fill="black" font-family="Arial" font-size="3.6px" x="74.5" y="262.0">GLUE FLAP (TO REAR / COLLAR ZONE)</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="28">ASSEMBLY (Sheet 05 only):</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="34">1) SCORE F1/F2/F3/F4/F5(M).</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="40">2) FOLD F1-F4 inward to 90° (valley).</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="46">3) FOLD F5(M) as mountain, then glue rear flap.</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="52">4) Glue 4 gray corner tabs inside side walls J.</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="58">5) Keep FRONT LIP toward dice exit side.</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="64">6) BLACK SOLID lines = CUT ONLY.</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="258">NOTE: If BLUE touches BLACK edge, treat it as FOLD line.</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="265">LEGEND</text><line fill="none" stroke="black" stroke-width="0.5" x1="10" x2="28" y1="269" y2="269" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="270">CUT</text><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="10" x2="28" y1="275" y2="275" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="276">VALLEY FOLD</text><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="10" x2="28" y1="281" y2="281" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="282">MOUNTAIN FOLD</text><rect fill="#e6e6e6" height="6" stroke="none" width="18" x="10" y="285" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="290">GLUE TAB</text><rect fill="none" height="20" stroke="black" stroke-width="0.5" width="20" x="180" y="267" /><text fill="black" font-family="Arial" font-size="3.6px" x="162" y="291">20 x 20 mm</text></svg>