<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="297mm" version="1.1" viewBox="0 0 210 297" width="210mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Sheet 06 - Assembly Instructions | A4 portrait 210x297 mm | target export 96 dpi</title><defs /><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="10">Sheet 06 - Assembly Instructions</text><text fill="black" font-family="Arial" font-size="4.6px" font-weight="bold" x="10" y="14">NECROMANCER DICE TOWER — RAMP ASSEMBLY GUIDE</text><text fill="black" font-family="Arial" font-size="3.0px" x="10" y="20.0">Print at 100% on 200–300 gsm cardstock. Score all fold lines before folding.</text><rect fill="none" height="52" stroke="#cccccc" stroke-width="0.4" width="190" x="10" y="32" /><text fill="#222222" font-family="Arial" font-size="4.6px" font-weight="bold" x="12" y="39">A — HOW TO FOLD A RAMP</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="46.0">1) CUT the ramp on black solid lines. 2) SCORE all BLUE dashed and RED dotted lines. 3) CUT</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="49.8">&amp; REMOVE all ORANGE notch triangles before folding. 4) FOLD in sequence: valley and mountain</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="53.6">lines, then glue side tabs to walls.</text><rect fill="none" height="38" stroke="#cccccc" stroke-width="0.4" width="190" x="10" y="88" /><text fill="#222222" font-family="Arial" font-size="4.6px" font-weight="bold" x="12" y="95">B — WHY NOTCHES ARE REQUIRED</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="102.0">At each step fold, side-wall strips must bend cleanly to 90°. Without removing the notch</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="105.8">triangles, paper bunches at the inner corner and the ramp cannot lie flat.</text><rect fill="none" height="86" stroke="#cccccc" stroke-width="0.4" width="190" x="10" y="130" /><text fill="#222222" font-family="Arial" font-size="4.6px" font-weight="bold" x="12" y="137">C — OVERALL ASSEMBLY ORDER</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="144.0">1) Print all sheets at 100% (no fit-to-page). 2) Score all fold lines before cutting. 3) Cut</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="147.8">black lines and remove all orange notches on ramps. 4) Assemble base tray (Sheet 05): F1-F4</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="151.6">valley, F5 mountain, glue corners. 5) Assemble body A + body B (Sheets 01-02). 6) Pre-fold</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="155.4">and glue ramps C, then B, then A on matching anchors. 7) Attach base tray and run a d6 drop</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="159.2">test.</text><rect fill="none" height="30" stroke="#cccccc" stroke-width="0.4" width="190" x="10" y="220" /><text fill="#222222" font-family="Arial" font-size="4.6px" font-weight="bold" x="12" y="227">D — MATERIALS &amp; TOOLS</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="234.0">• Cardstock: 200-250 gsm recommended. • Glue: PVA or glue stick (thin bead). • Tools: bone</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="237.8">folder, craft knife + metal ruler, scissors for small trims. • Avoid hot glue for</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="241.6">alignment-sensitive joints.</text><text fill="black" font-family="Arial" font-size="2.09px" x="10" y="260">LEGEND</text><line fill="none" stroke="black" stroke-width="0.5" x1="10" x2="20.439999999999998" y1="262.32" y2="262.32" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="262.9">CUT</text><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="10" x2="20.439999999999998" y1="265.8" y2="265.8" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="266.38">VALLEY FOLD</text><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="10" x2="20.439999999999998" y1="269.28" y2="269.28" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="269.85999999999996">MOUNTAIN FOLD</text><rect fill="#e6e6e6" height="3.4799999999999995" stroke="none" width="10.44" x="10" y="271.6" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="274.5">GLUE TAB</text><polygon fill="#FF6600" points="10,276.24 20.439999999999998,276.24 10,279.72" stroke="black" stroke-width="0.23199999999999998" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="279.14">NOTCH – CUT &amp; REMOVE</text><rect fill="none" height="20" stroke="black" stroke-width="0.5" width="20" x="180" y="267" /><text fill="black" font-family="Arial" font-size="3.6px" x="162" y="291">20 x 20 mm</text></svg>