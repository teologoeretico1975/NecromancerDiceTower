<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="297mm" version="1.1" viewBox="0 0 210 297" width="210mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Sheet 06 - Assembly Instructions | A4 portrait 210x297 mm | target export 96 dpi</title><defs /><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="10">Sheet 06 - Assembly Instructions</text><text fill="black" font-family="Arial" font-size="4.6px" font-weight="bold" x="10" y="14">NECROMANCER DICE TOWER — BAFFLE CORE GUIDE</text><text fill="black" font-family="Arial" font-size="3.0px" x="10" y="20.0">Print at 100% on 200–300 gsm cardstock. Score all fold lines before folding.</text><rect fill="none" height="52" stroke="#cccccc" stroke-width="0.4" width="190" x="10" y="32" /><text fill="#222222" font-family="Arial" font-size="4.6px" font-weight="bold" x="12" y="39">A — PREPARE BULKHEADS (B1/B2)</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="46.0">1) CUT B1 and B2 on black solid lines. 2) SCORE BLUE lines and fold side glue tabs to 90°.</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="49.8">3) CUT the alternating windows exactly as printed. 4) Keep windows mirrored: B1 top-left, B2</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="53.6">top-right.</text><rect fill="none" height="38" stroke="#cccccc" stroke-width="0.4" width="190" x="10" y="88" /><text fill="#222222" font-family="Arial" font-size="4.6px" font-weight="bold" x="12" y="95">B — WHY BAFFLES (ANTI-JAM)</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="102.0">Baffles increase random impacts while preserving a wider free channel than stepped ramps.</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="105.8">Alternating openings plus staggered fins reduce jams and keep die flow stable.</text><rect fill="none" height="86" stroke="#cccccc" stroke-width="0.4" width="190" x="10" y="130" /><text fill="#222222" font-family="Arial" font-size="4.6px" font-weight="bold" x="12" y="137">C — OVERALL ASSEMBLY ORDER</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="144.0">1) Print all sheets at 100% (no fit-to-page). 2) Score all fold lines before cutting. 3)</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="147.8">Assemble body A + body B (Sheets 01-02) and keep seam open for insert steps. 4) Assemble</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="151.6">base tray (Sheet 05): F1-F4 valley, F5 mountain, glue corners. 5) Install B1 in upper zone</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="155.4">and B2 below it with 25-30 mm gap; tabs glue to opposite walls. 6) Install D1-D6 fins on</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="159.2">left/right walls, staggered, fold angle 30-45° toward center. 7) Close body seam, attach</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="163.0">base tray, verify center channel &gt;=30 mm, run d6 drop test.</text><rect fill="none" height="30" stroke="#cccccc" stroke-width="0.4" width="190" x="10" y="220" /><text fill="#222222" font-family="Arial" font-size="4.6px" font-weight="bold" x="12" y="227">D — TEST CRITERIA</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="234.0">• Target pass: d6 &gt;=95% exit, d20 &gt;=90% exit, no persistent jam points. • If jams occur,</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="237.8">reduce fin angle or widen center lane before re-test. • Keep glue beads thin and avoid spill</text><text fill="black" font-family="Arial" font-size="3.0px" x="12" y="241.6">in window/opening zones. • Recommended cardstock: 200-250 gsm.</text><text fill="black" font-family="Arial" font-size="2.09px" x="10" y="260">LEGEND</text><line fill="none" stroke="black" stroke-width="0.5" x1="10" x2="20.439999999999998" y1="262.32" y2="262.32" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="262.9">CUT</text><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="10" x2="20.439999999999998" y1="265.8" y2="265.8" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="266.38">VALLEY FOLD</text><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="10" x2="20.439999999999998" y1="269.28" y2="269.28" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="269.85999999999996">MOUNTAIN FOLD</text><rect fill="#e6e6e6" height="3.4799999999999995" stroke="none" width="10.44" x="10" y="271.6" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="274.5">GLUE TAB</text><polygon fill="#FF6600" points="10,276.24 20.439999999999998,276.24 10,279.72" stroke="black" stroke-width="0.23199999999999998" /><text fill="black" font-family="Arial" font-size="2.09px" x="22.18" y="279.14">NOTCH – CUT &amp; REMOVE</text><rect fill="none" height="20" stroke="black" stroke-width="0.5" width="20" x="180" y="267" /><text fill="black" font-family="Arial" font-size="3.6px" x="162" y="291">20 x 20 mm</text></svg>