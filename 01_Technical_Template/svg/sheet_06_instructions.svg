<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="297mm" version="1.1" viewBox="0 0 210 297" width="210mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Sheet 06 - Assembly Instructions | A4 portrait 210x297 mm | target export 96 dpi</title><defs /><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="10">Sheet 06 - Assembly Instructions</text><text fill="black" font-family="Arial" font-size="6px" font-weight="bold" x="10" y="14">NECROMANCER DICE TOWER — RAMP ASSEMBLY GUIDE</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="21">Print at 100% on 200–300 gsm cardstock. Use a bone folder or butter knife to score ALL fold lines before folding.</text><text fill="#222222" font-family="Arial" font-size="5px" font-weight="bold" x="10" y="30">A — HOW TO FOLD A RAMP (applies to RAMP A, B and C)</text><text fill="black" font-family="Arial" font-size="6px" font-weight="bold" x="10" y="38">1.</text><text fill="black" font-family="Arial" font-size="5px" font-weight="bold" x="17" y="38">CUT OUT FLAT</text><rect fill="white" height="40" stroke="black" stroke-width="1" width="58.0" x="10" y="40" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="10" x2="68.0" y1="46.666666666666664" y2="46.666666666666664" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="10" x2="68.0" y1="53.333333333333336" y2="53.333333333333336" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="10" x2="68.0" y1="60.0" y2="60.0" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="10" x2="68.0" y1="66.66666666666667" y2="66.66666666666667" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="10" x2="68.0" y1="73.33333333333334" y2="73.33333333333334" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="15" x2="15" y1="40" y2="80" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="63.0" x2="63.0" y1="40" y2="80" /><polygon fill="#FF6600" points="10,46.666666666666664 15,46.666666666666664 10,52.22222222222222" stroke="black" stroke-width="0.3" /><polygon fill="#FF6600" points="63.0,46.666666666666664 68.0,46.666666666666664 68.0,52.22222222222222" stroke="black" stroke-width="0.3" /><polygon fill="#FF6600" points="10,53.333333333333336 15,53.333333333333336 10,58.88888888888889" stroke="black" stroke-width="0.3" /><polygon fill="#FF6600" points="63.0,53.333333333333336 68.0,53.333333333333336 68.0,58.88888888888889" stroke="black" stroke-width="0.3" /><polygon fill="#FF6600" points="10,60.0 15,60.0 10,65.55555555555556" stroke="black" stroke-width="0.3" /><polygon fill="#FF6600" points="63.0,60.0 68.0,60.0 68.0,65.55555555555556" stroke="black" stroke-width="0.3" /><polygon fill="#FF6600" points="10,66.66666666666667 15,66.66666666666667 10,72.22222222222223" stroke="black" stroke-width="0.3" /><polygon fill="#FF6600" points="63.0,66.66666666666667 68.0,66.66666666666667 68.0,72.22222222222223" stroke="black" stroke-width="0.3" /><polygon fill="#FF6600" points="10,73.33333333333334 15,73.33333333333334 10,78.8888888888889" stroke="black" stroke-width="0.3" /><polygon fill="#FF6600" points="63.0,73.33333333333334 68.0,73.33333333333334 68.0,78.8888888888889" stroke="black" stroke-width="0.3" /><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="86">All fold lines printed.</text><text fill="#FF6600" font-family="Arial" font-size="3.6px" font-weight="bold" x="10" y="90">ORANGE = notch to cut.</text><line stroke="black" stroke-width="1" x1="70.0" x2="77.0" y1="60" y2="60" /><polygon fill="black" points="78.0,60 75.0,58 75.0,62" /><text fill="black" font-family="Arial" font-size="6px" font-weight="bold" x="78.0" y="38">2.</text><text fill="black" font-family="Arial" font-size="5px" font-weight="bold" x="85.0" y="38">SCORE + CUT NOTCHES</text><rect fill="white" height="40" stroke="black" stroke-width="1" width="58.0" x="78.0" y="40" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="78.0" x2="136.0" y1="46.666666666666664" y2="46.666666666666664" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="78.0" x2="136.0" y1="53.333333333333336" y2="53.333333333333336" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="78.0" x2="136.0" y1="60.0" y2="60.0" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="78.0" x2="136.0" y1="66.66666666666667" y2="66.66666666666667" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="78.0" x2="136.0" y1="73.33333333333334" y2="73.33333333333334" /><polygon fill="white" points="78.0,46.666666666666664 83.0,46.666666666666664 78.0,52.22222222222222" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><polygon fill="white" points="131.0,46.666666666666664 136.0,46.666666666666664 136.0,52.22222222222222" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><polygon fill="white" points="78.0,53.333333333333336 83.0,53.333333333333336 78.0,58.88888888888889" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><polygon fill="white" points="131.0,53.333333333333336 136.0,53.333333333333336 136.0,58.88888888888889" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><polygon fill="white" points="78.0,60.0 83.0,60.0 78.0,65.55555555555556" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><polygon fill="white" points="131.0,60.0 136.0,60.0 136.0,65.55555555555556" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><polygon fill="white" points="78.0,66.66666666666667 83.0,66.66666666666667 78.0,72.22222222222223" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><polygon fill="white" points="131.0,66.66666666666667 136.0,66.66666666666667 136.0,72.22222222222223" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><polygon fill="white" points="78.0,73.33333333333334 83.0,73.33333333333334 78.0,78.8888888888889" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><polygon fill="white" points="131.0,73.33333333333334 136.0,73.33333333333334 136.0,78.8888888888889" stroke="black" stroke-dasharray="1,1" stroke-width="0.5" /><text fill="black" font-family="Arial" font-size="3.6px" x="78.0" y="86">Score BLUE + RED lines.</text><text fill="black" font-family="Arial" font-size="3.6px" x="78.0" y="90">Cut &amp; remove ORANGE triangles.</text><line stroke="black" stroke-width="1" x1="138.0" x2="145.0" y1="60" y2="60" /><polygon fill="black" points="146.0,60 143.0,58 143.0,62" /><text fill="black" font-family="Arial" font-size="6px" font-weight="bold" x="146.0" y="38">3.</text><text fill="black" font-family="Arial" font-size="5px" font-weight="bold" x="153.0" y="38">FOLD STEPS</text><polyline fill="none" points="146.0,40 155.66666666666666,48 165.33333333333334,40 175.0,48 184.66666666666666,40 194.33333333333331,48 204.0,40" stroke="black" stroke-width="1.2" /><polyline fill="none" points="146.0,55 155.66666666666666,63 165.33333333333334,55 175.0,63 184.66666666666666,55 194.33333333333331,63 204.0,55" stroke="black" stroke-width="1.2" /><line stroke="black" stroke-width="0.8" x1="146.0" x2="146.0" y1="40" y2="55" /><line stroke="black" stroke-width="0.8" x1="155.66666666666666" x2="155.66666666666666" y1="48" y2="63" /><line stroke="black" stroke-width="0.8" x1="165.33333333333334" x2="165.33333333333334" y1="40" y2="55" /><line stroke="black" stroke-width="0.8" x1="175.0" x2="175.0" y1="48" y2="63" /><line stroke="black" stroke-width="0.8" x1="184.66666666666666" x2="184.66666666666666" y1="40" y2="55" /><line stroke="black" stroke-width="0.8" x1="194.33333333333331" x2="194.33333333333331" y1="48" y2="63" /><line stroke="black" stroke-width="0.8" x1="204.0" x2="204.0" y1="40" y2="55" /><text fill="black" font-family="Arial" font-size="3.6px" x="146.0" y="86">Result: stepped profile</text><text fill="black" font-family="Arial" font-size="3.6px" x="146.0" y="90">side walls stand vertical.</text><line stroke="black" stroke-width="1" x1="206.0" x2="213.0" y1="60" y2="60" /><polygon fill="black" points="214.0,60 211.0,58 211.0,62" /><text fill="black" font-family="Arial" font-size="6px" font-weight="bold" x="214.0" y="38">4.</text><text fill="black" font-family="Arial" font-size="5px" font-weight="bold" x="221.0" y="38">GLUE INTO TOWER</text><rect fill="none" height="36" stroke="black" stroke-width="1" width="48.0" x="219.0" y="42" /><polyline fill="none" points="222.0,45 232.0,53 242.0,45 252.0,53" stroke="black" stroke-width="1.2" /><rect fill="#e6e6e6" height="36" stroke="none" width="3" x="219.0" y="42" /><rect fill="#e6e6e6" height="36" stroke="none" width="3" x="254.0" y="42" /><text fill="black" font-family="Arial" font-size="3.6px" x="214.0" y="86">Gray side tabs glue</text><text fill="black" font-family="Arial" font-size="3.6px" x="214.0" y="90">to tower SIDE WALLS.</text><text fill="#222222" font-family="Arial" font-size="5px" font-weight="bold" x="10" y="100">B — WHY THE ORANGE NOTCH CUTS</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="107">At each step fold, the side-wall strip must bend 90°. Without removing the orange triangle,</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="112">excess paper bunches at the inner corner and prevents the fold from lying flat.</text><text fill="black" font-family="Arial" font-size="3.6px" x="15" y="118">WITHOUT notch (wrong):</text><rect fill="white" height="8" stroke="black" stroke-width="0.7" width="30" x="15" y="120" /><rect fill="white" height="14" stroke="black" stroke-width="0.7" width="30" x="15" y="128" /><polygon fill="#ffaaaa" points="15,128 21,128 15,134" stroke="red" stroke-width="0.5" /><text fill="black" font-family="Arial" font-size="3.6px" x="46" y="132">← paper bunches here</text><text fill="black" font-family="Arial" font-size="3.6px" x="110" y="118">WITH notch (correct):</text><rect fill="white" height="8" stroke="black" stroke-width="0.7" width="30" x="110" y="120" /><rect fill="white" height="14" stroke="black" stroke-width="0.7" width="30" x="110" y="128" /><polygon fill="white" points="110,128 115,128 110,133" stroke="black" stroke-dasharray="1,1" stroke-width="0.4" /><text fill="black" font-family="Arial" font-size="3.6px" x="141" y="132">← clean corner</text><text fill="#222222" font-family="Arial" font-size="5px" font-weight="bold" x="10" y="152">C — OVERALL ASSEMBLY ORDER</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="159.0">1. Print all sheets at 100% — do NOT scale to fit.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="164.0">2. SCORE all blue dashed (valley) and red dotted (mountain) fold lines BEFORE cutting.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="169.0">3. CUT all solid black lines. Remove orange notch triangles on each ramp.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="174.0">4. BASE TRAY (Sheet 05): fold F1–F4 valley, F5 mountain, glue corner tabs.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="179.0">5. BODY A (Sheet 01): fold panels — front + left side.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="184.0">6. BODY B (Sheet 02): fold panels — back + right side. Glue A+B together.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="189.0">7. Pre-fold RAMP C (lowest), dry-fit, glue onto anchor marks C-L / C-R.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="194.0">8. Pre-fold RAMP B, dry-fit on B-L / B-R. Verify HIGH/LOW orientation.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="199.0">9. Pre-fold RAMP A, dry-fit on A-L / A-R. Verify flow direction.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="204.0">10. Glue one side-tab first; verify ramp lays flat; then glue opposite tab.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="209.0">11. Attach base tray. Drop test with d6 to verify free passage.</text><line stroke="#cccccc" stroke-width="0.4" x1="10" x2="190" y1="218.0" y2="218.0" /><text fill="#222222" font-family="Arial" font-size="5px" font-weight="bold" x="10" y="221.0">D — MATERIALS &amp; TOOLS</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="228.0">• Cardstock: 200–250 gsm recommended (300 gsm possible).</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="233.0">• Score with bone folder, blunt scissors back, or empty ballpoint.</text><text fill="black" font-family="Arial" font-size="3.6px" x="12" y="238.0">• Cut with craft knife + metal ruler on cutting mat.</text><text fill="black" font-family="Arial" font-size="3.6px" x="107" y="228.0">• Glue: PVA or glue stick. Thin bead; hold 30 s.</text><text fill="black" font-family="Arial" font-size="3.6px" x="107" y="233.0">• Do NOT use hot glue — sets before alignment.</text><text fill="black" font-family="Arial" font-size="3.6px" x="107" y="238.0">• Scissors only for gentle curves, not fold lines.</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="259">LEGEND</text><line fill="none" stroke="black" stroke-width="0.5" x1="10" x2="28" y1="263" y2="263" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="264">CUT</text><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="10" x2="28" y1="269" y2="269" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="270">VALLEY FOLD</text><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="10" x2="28" y1="275" y2="275" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="276">MOUNTAIN FOLD</text><rect fill="#e6e6e6" height="6" stroke="none" width="18" x="10" y="279" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="284">GLUE TAB</text><polygon fill="#FF6600" points="10,287 28,287 10,293" stroke="black" stroke-width="0.4" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="292">NOTCH – CUT &amp; REMOVE</text><rect fill="none" height="20" stroke="black" stroke-width="0.5" width="20" x="180" y="267" /><text fill="black" font-family="Arial" font-size="3.6px" x="162" y="291">20 x 20 mm</text></svg>