<svg baseProfile="full" height="297mm" version="1.1" viewBox="0 0 210 297" width="210mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Sheet 03 - Ramps A and B | A4 portrait 210x297 mm | target export 96 dpi</title><defs /><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="10">Sheet 03 - Ramps A and B</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="16">GEOMETRIC DEVELOPMENT (v002): accordion/stepped profile.</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="22">Pitch p=8mm, rise h=3.0mm, modules=8.</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="28">Horizontal folds alternate M/V from BACK TAB hinge (red then blue...).</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="34">Flow directions: RAMP A L-&gt;R, RAMP B R-&gt;L.</text><text fill="black" font-family="Arial" font-size="3.6px" x="148" y="9">3D EXAMPLE (folded profile)</text><polyline fill="none" points="148,16 156,13 172,13 180,16" stroke="black" stroke-width="0.5" /><polyline fill="none" points="148,28 156,25 172,25 180,28" stroke="black" stroke-width="0.5" /><line fill="none" stroke="black" stroke-width="0.5" x1="148" x2="148" y1="16" y2="28" /><line fill="none" stroke="black" stroke-width="0.5" x1="156" x2="156" y1="13" y2="25" /><line fill="none" stroke="black" stroke-width="0.5" x1="172" x2="172" y1="13" y2="25" /><line fill="none" stroke="black" stroke-width="0.5" x1="180" x2="180" y1="16" y2="28" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="156" x2="160" y1="19" y2="22" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="160" x2="164" y1="22" y2="19" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="164" x2="168" y1="19" y2="22" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="168" x2="172" y1="22" y2="19" /><text fill="black" font-family="Arial" font-size="3.6px" x="181" y="23">M/V</text><text fill="black" font-family="Arial" font-size="5px" font-weight="bold" x="5" y="45">HOW TO FOLD YOUR RAMP — 3 SIMPLE STEPS</text><text fill="black" font-family="Arial" font-size="5px" font-weight="bold" x="5" y="55">1. FLAT NET</text><rect fill="white" height="14" stroke="black" stroke-width="1" width="20" x="7" y="57" /><text fill="black" font-family="Arial" font-size="3.5px" x="13" y="65">all pieces</text><text fill="black" font-family="Arial" font-size="3.5px" x="10" y="69">flat &amp; unfolded</text><line stroke="black" stroke-width="1" x1="30" x2="37" y1="64" y2="64" /><polygon fill="black" points="37,64 34,62 34,66" /><text fill="black" font-family="Arial" font-size="5px" font-weight="bold" x="43" y="55">2. SCORE &amp; FOLD</text><rect fill="white" height="7" stroke="black" stroke-width="1" width="20" x="43" y="57" /><line stroke="blue" stroke-dasharray="3,2" stroke-width="1" x1="43" x2="63" y1="61" y2="61" /><text fill="blue" font-family="Arial" font-size="3.5px" x="46" y="68">fold here</text><polyline fill="none" points="43,64 53,70" stroke="blue" stroke-dasharray="3,2" stroke-width="1" /><polyline fill="none" points="63,64 53,70" stroke="blue" stroke-dasharray="3,2" stroke-width="1" /><line stroke="black" stroke-width="1" x1="66" x2="73" y1="64" y2="64" /><polygon fill="black" points="73,64 70,62 70,66" /><text fill="black" font-family="Arial" font-size="5px" font-weight="bold" x="80" y="55">3. GLUE &amp; DONE</text><polyline fill="none" points="80,60 87,57 94,60 101,57" stroke="black" stroke-width="1.5" /><polyline fill="none" points="80,71 87,74 94,71 101,74" stroke="black" stroke-width="1.5" /><rect fill="#cccccc" height="4" stroke="blue" stroke-width="0.5" width="3" x="78" y="62" /><rect fill="#cccccc" height="4" stroke="blue" stroke-width="0.5" width="3" x="102" y="62" /><text fill="blue" font-family="Arial" font-size="3.5px" x="85" y="77">glue</text><text fill="blue" font-family="Arial" font-size="3.5px" x="85" y="81">tabs</text><text fill="black" font-family="Arial" font-size="4px" font-weight="bold" x="5" y="80">TIP: Fold at BACK TAB (top) first, then work downward.</text><text fill="blue" font-family="Arial" font-size="3.5px" x="5" y="85">All BLUE dashed lines = VALLEY folds (crease inward ↓)</text><text fill="red" font-family="Arial" font-size="3.5px" x="5" y="90">All RED dotted lines = MOUNTAIN folds (crease outward ↑)</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="110">RAMP A (follow 1-2-3 steps above):</text><rect fill="#e6e6e6" height="81.0" stroke="none" width="8.0" x="20" y="130" /><rect fill="#e6e6e6" height="81.0" stroke="none" width="8.0" x="85.0" y="130" /><rect fill="#e6e6e6" height="8.0" stroke="none" width="57.0" x="28.0" y="122.0" /><rect fill="none" height="81.0" stroke="black" stroke-width="0.5" width="73.0" x="20" y="130" /><rect fill="none" height="8.0" stroke="black" stroke-width="0.5" width="57.0" x="28.0" y="122.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="28.0" x2="28.0" y1="130" y2="211.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="85.0" x2="85.0" y1="130" y2="211.0" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="28.0" x2="85.0" y1="130" y2="130" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="28.0" x2="85.0" y1="138.0" y2="138.0" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="28.0" x2="85.0" y1="146.0" y2="146.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="28.0" x2="85.0" y1="154.0" y2="154.0" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="28.0" x2="85.0" y1="162.0" y2="162.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="28.0" x2="85.0" y1="170.0" y2="170.0" /><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="28.0" x2="85.0" y1="178.0" y2="178.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="28.0" x2="85.0" y1="186.0" y2="186.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="33.0" x2="33.0" y1="130" y2="211.0" /><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="80.0" x2="80.0" y1="130" y2="211.0" /><text fill="black" font-family="Arial" font-size="3.6px" x="30.0" y="142">RAMP A</text><text fill="black" font-family="Arial" font-size="3.6px" x="30.0" y="150">HIGH SIDE</text><text fill="black" font-family="Arial" font-size="3.6px" x="67.0" y="150">LOW SIDE</text><text dominant-baseline="middle" fill="black" font-family="Arial" font-size="3.6px" text-anchor="middle" transform="rotate(-90 24.0 170.5)" x="24.0" y="170.5">GLUE TO WALL</text><text dominant-baseline="middle" fill="black" font-family="Arial" font-size="3.6px" text-anchor="middle" transform="rotate(90 89.0 170.5)" x="89.0" y="170.5">GLUE TO WALL</text><text fill="black" font-family="Arial" font-size="3.6px" x="48.5" y="128">BACK TAB</text><text fill="black" font-family="Arial" font-size="3.6px" x="30.0" y="207.0">FLOW -&gt;</text><text fill="black" font-family="Arial" font-size="3.6px" x="10" y="265">LEGEND</text><line fill="none" stroke="black" stroke-width="0.5" x1="10" x2="28" y1="269" y2="269" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="270">CUT</text><line fill="none" stroke="blue" stroke-dasharray="4,2" stroke-width="0.5" x1="10" x2="28" y1="275" y2="275" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="276">VALLEY FOLD</text><line fill="none" stroke="red" stroke-dasharray="1,2" stroke-width="0.5" x1="10" x2="28" y1="281" y2="281" /><text fill="black" font-family="Arial" font-size="3.6px" x="31" y="282">MOUNTAIN FOLD</text><rect fill="#e6e6e6" height="6" stroke="none" width="18" x="10" y="285" /><text fill="black" font-family=