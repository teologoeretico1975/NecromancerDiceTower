<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="210mm"
  height="297mm"
  viewBox="0 0 210 297">

  <title>Necromancer Dice Tower — A4 Technical Template Setup</title>

  <!-- Safe margin -->
  <rect
    x="10"
    y="10"
    width="190"
    height="277"
    fill="none"
    stroke="#cccccc"
    stroke-width="0.3"
    stroke-dasharray="2 2" />

  <!-- Page title -->
  <text
    x="10"
    y="7"
    font-size="4"
    font-family="Arial">
    Necromancer Dice Tower — Technical Template v001
  </text>

  <!-- Example cut rectangle -->
  <rect
    x="20"
    y="20"
    width="65"
    height="190"
    fill="none"
    stroke="#000000"
    stroke-width="0.3" />

  <text
    x="35"
    y="115"
    font-size="5"
    font-family="Arial">
    FRONT
  </text>

  <!-- Example fold line -->
  <line
    x1="85"
    y1="20"
    x2="85"
    y2="210"
    stroke="#0066cc"
    stroke-width="0.3"
    stroke-dasharray="3 2" />

  <!-- Example glue tab -->
  <rect
    x="85"
    y="20"
    width="10"
    height="190"
    fill="#eeeeee"
    stroke="#000000"
    stroke-width="0.3" />

  <text
    x="87"
    y="115"
    font-size="3"
    font-family="Arial"
    transform="rotate(90 87 115)">
    GLUE
  </text>

  <!-- Scale check square -->
  <rect
    x="10"
    y="262"
    width="20"
    height="20"
    fill="none"
    stroke="#000000"
    stroke-width="0.3" />

  <text
    x="35"
    y="274"
    font-size="3"
    font-family="Arial">
    Scale check: 20 × 20 mm
  </text>

  <!-- Legend -->
  <text x="120" y="250" font-size="4" font-family="Arial">Legend</text>

  <line
    x1="120"
    y1="258"
    x2="145"
    y2="258"
    stroke="#000000"
    stroke-width="0.3" />
  <text x="150" y="259" font-size="3" font-family="Arial">Cut</text>

  <line
    x1="120"
    y1="265"
    x2="145"
    y2="265"
    stroke="#0066cc"
    stroke-width="0.3"
    stroke-dasharray="3 2" />
  <text x="150" y="266" font-size="3" font-family="Arial">Valley fold</text>

  <line
    x1="120"
    y1="272"
    x2="145"
    y2="272"
    stroke="#cc0000"
    stroke-width="0.3"
    stroke-dasharray="1 2" />
  <text x="150" y="273" font-size="3" font-family="Arial">Mountain fold</text>

  <rect
    x="120"
    y="278"
    width="25"
    height="5"
    fill="#eeeeee"
    stroke="#000000"
    stroke-width="0.3" />
  <text x="150" y="282" font-size="3" font-family="Arial">Glue tab</text>

</svg>